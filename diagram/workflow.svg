<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" width="1000" height="458" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Loan assessment workflow: today and redesigned</title>
  <desc>Two columns side by side. Today, a loan officer reads, types, compares, visits and recommends, and a manager decides. Redesigned, an AI reads the documents, code raises review flags, the officer checks them, a scorecard recommends, and the loan officer decides and can override. Human decision points are filled navy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="458" fill="#ffffff"/>

  <!-- column headings -->
  <text x="10" y="22" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">TODAY (generic model)</text>
  <rect x="10" y="30" width="470" height="2" fill="#111111"/>
  <text x="520" y="22" font-size="17" font-weight="700" fill="#1F3A5F" letter-spacing="0.5">REDESIGNED (proposed)</text>
  <rect x="520" y="30" width="470" height="2" fill="#1F3A5F"/>

  <!-- ===== LEFT COLUMN: today, six steps ===== -->
  <g stroke="#111111" stroke-width="1.5" fill="#ffffff">
    <rect x="10" y="44"  width="470" height="50" rx="2"/>
    <rect x="10" y="108" width="470" height="50" rx="2"/>
    <rect x="10" y="172" width="470" height="50" rx="2"/>
    <rect x="10" y="236" width="470" height="50" rx="2"/>
    <rect x="10" y="300" width="470" height="50" rx="2" fill="#1F3A5F" stroke="#1F3A5F"/>
    <rect x="10" y="364" width="470" height="50" rx="2"/>
  </g>
  <g stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <line x1="245" y1="94"  x2="245" y2="107"/>
    <line x1="245" y1="158" x2="245" y2="171"/>
    <line x1="245" y1="222" x2="245" y2="235"/>
    <line x1="245" y1="286" x2="245" y2="299"/>
    <line x1="245" y1="350" x2="245" y2="363"/>
  </g>
  <g fill="#111111" font-size="15">
    <text x="24" y="65" font-weight="700">Applicant brings documents</text>
    <text x="24" y="84" font-size="14">Officer collects ID, income records, cost estimate</text>
    <text x="24" y="129" font-weight="700">Officer reads and types the fields</text>
    <text x="24" y="148" font-size="14">By hand, into a form or spreadsheet</text>
    <text x="24" y="193" font-weight="700">Officer compares documents by eye</text>
    <text x="24" y="212" font-size="14">Conflicts and changed figures are easy to miss</text>
    <text x="24" y="257" font-weight="700">Officer visits and judges the case</text>
    <text x="24" y="276" font-size="14">Cash flow and character, from notes and memory</text>
    <text x="24" y="385" font-weight="700">File stored</text>
    <text x="24" y="404" font-size="14">Little feedback on overrides or outcomes</text>
  </g>
  <g fill="#ffffff" font-size="15">
    <text x="24" y="321" font-weight="700">Officer recommends, manager decides</text>
    <text x="24" y="340" font-size="14">The reasons stay in short notes</text>
  </g>

  <!-- ===== RIGHT COLUMN: redesigned, seven steps ===== -->
  <g stroke="#111111" stroke-width="1.5" fill="#ffffff">
    <rect x="520" y="44"  width="470" height="42" rx="2"/>
    <rect x="520" y="99"  width="470" height="42" rx="2" stroke-dasharray="7 4"/>
    <rect x="520" y="154" width="470" height="42" rx="2" stroke-dasharray="7 4"/>
    <rect x="520" y="209" width="470" height="42" rx="2"/>
    <rect x="520" y="264" width="470" height="42" rx="2" stroke-dasharray="7 4"/>
    <rect x="520" y="319" width="470" height="42" rx="2" fill="#1F3A5F" stroke="#1F3A5F"/>
    <rect x="520" y="374" width="470" height="42" rx="2"/>
  </g>
  <g stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <line x1="755" y1="86"  x2="755" y2="98"/>
    <line x1="755" y1="141" x2="755" y2="153"/>
    <line x1="755" y1="196" x2="755" y2="208"/>
    <line x1="755" y1="251" x2="755" y2="263"/>
    <line x1="755" y1="306" x2="755" y2="318"/>
    <line x1="755" y1="361" x2="755" y2="373"/>
  </g>
  <g fill="#111111" font-size="15">
    <text x="534" y="62" font-weight="700">Applicant consents and brings documents</text>
    <text x="534" y="79" font-size="14">A person-only route is offered to everyone</text>
    <text x="534" y="117" font-weight="700">AI reads the documents</text>
    <text x="534" y="134" font-size="14">Lists each field and where it came from</text>
    <text x="534" y="172" font-weight="700">Code checks and raises review flags</text>
    <text x="534" y="189" font-size="14">Missing, out of range, conflicting, low confidence</text>
    <text x="534" y="227" font-weight="700">Officer checks flags against the source</text>
    <text x="534" y="244" font-size="14">Fixes misreadings, visits when flagged</text>
    <text x="534" y="282" font-weight="700">Scorecard recommends, with reasons</text>
    <text x="534" y="299" font-size="14">A suggestion only. It never declines anyone</text>
    <text x="534" y="392" font-weight="700">Overrides and reasons are logged</text>
    <text x="534" y="409" font-size="14">Team lead reviews patterns monthly, by group</text>
  </g>
  <g fill="#ffffff" font-size="15">
    <text x="534" y="337" font-weight="700">Loan officer decides</text>
    <text x="534" y="354" font-size="14">Approve, change, decline or refer. Can override</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="14" fill="#111111">
    <rect x="10" y="436" width="30" height="14" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="50" y="448">Person does it</text>
    <rect x="200" y="436" width="30" height="14" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="240" y="448">AI or code does it</text>
    <rect x="410" y="436" width="30" height="14" rx="2" fill="#1F3A5F" stroke="#1F3A5F"/>
    <text x="450" y="448">Person decides</text>
    <text x="990" y="448" text-anchor="end">The AI and the scorecard never decide</text>
  </g>
</svg>
