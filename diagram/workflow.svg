<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Loan assessment workflow: today and redesigned</title>
  <desc>Seven aligned rows compare a typical manual loan assessment with the proposed redesign. In the redesign an AI reads the documents, code raises review flags, the officer checks them, a scorecard recommends and the loan officer decides and can override. Human decision points are filled navy. Overrides are logged and reviewed, and the review refines the checks.</desc>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#111111"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1F3A5F"/></marker>
  </defs>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="10" y="19" font-size="17" font-weight="700" letter-spacing="0.6" fill="#111111">TODAY</text>
  <text x="82" y="19" font-size="13.5" fill="#3a3a3a">generic model, not any one lender</text>
  <rect x="10" y="28" width="425" height="2" fill="#111111"/>
  <text x="565" y="19" font-size="17" font-weight="700" letter-spacing="0.6" fill="#111111">REDESIGNED</text>
  <text x="689" y="19" font-size="13.5" fill="#3a3a3a">proposed, not deployed</text>
  <rect x="565" y="28" width="388" height="2" fill="#1F3A5F"/>
  <line x1="500" y1="82.0" x2="500" y2="108.0" stroke="#111111" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="500" y1="134.0" x2="500" y2="160.0" stroke="#111111" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="500" y1="186.0" x2="500" y2="212.0" stroke="#111111" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="500" y1="238.0" x2="500" y2="264.0" stroke="#111111" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="500" y1="290.0" x2="500" y2="316.0" stroke="#111111" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="500" y1="342.0" x2="500" y2="368.0" stroke="#111111" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="435" y1="69.0" x2="487" y2="69.0" stroke="#111111" stroke-width="1" />
  <line x1="513" y1="69.0" x2="565" y2="69.0" stroke="#111111" stroke-width="1" />
  <circle cx="500" cy="69.0" r="13" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="74.0" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">1</text>
  <g>
    <rect x="10" y="48" width="425" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="24" y="66" font-size="15" font-weight="700" fill="#111111">Applicant brings documents</text>
    <text x="24" y="83" font-size="13.5" fill="#3a3a3a">Officer collects ID, income records, cost estimate</text>
  </g>
  <g>
    <rect x="565" y="48" width="388" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="579" y="66" font-size="15" font-weight="700" fill="#111111">Applicant consents and brings documents</text>
    <text x="579" y="83" font-size="13.5" fill="#3a3a3a">A person-only route is offered to everyone</text>
  </g>
  <line x1="435" y1="121.0" x2="487" y2="121.0" stroke="#111111" stroke-width="1" />
  <line x1="513" y1="121.0" x2="565" y2="121.0" stroke="#111111" stroke-width="1" />
  <circle cx="500" cy="121.0" r="13" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="126.0" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">2</text>
  <g>
    <rect x="10" y="100" width="425" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="24" y="118" font-size="15" font-weight="700" fill="#111111">Officer reads and types the fields</text>
    <text x="24" y="135" font-size="13.5" fill="#3a3a3a">By hand, into a form or spreadsheet</text>
  </g>
  <g>
    <rect x="565" y="100" width="388" height="42" rx="2" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="1.25"/>
    <text x="579" y="118" font-size="15" font-weight="700" fill="#111111">AI reads the documents</text>
    <text x="579" y="135" font-size="13.5" fill="#3a3a3a">Lists each field and where it came from</text>
    <text x="941" y="118" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#111111">AI</text>
  </g>
  <line x1="435" y1="173.0" x2="487" y2="173.0" stroke="#111111" stroke-width="1" />
  <line x1="513" y1="173.0" x2="565" y2="173.0" stroke="#111111" stroke-width="1" />
  <circle cx="500" cy="173.0" r="13" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="178.0" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">3</text>
  <g>
    <rect x="10" y="152" width="425" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="24" y="170" font-size="15" font-weight="700" fill="#111111">Officer compares documents by eye</text>
    <text x="24" y="187" font-size="13.5" fill="#3a3a3a">Conflicts and changed figures are easy to miss</text>
  </g>
  <g>
    <rect x="565" y="152" width="388" height="42" rx="2" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="1.25"/>
    <text x="579" y="170" font-size="15" font-weight="700" fill="#111111">Code raises review flags</text>
    <text x="579" y="187" font-size="13.5" fill="#3a3a3a">Missing, out of range, conflicting, unsure</text>
    <text x="941" y="170" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#111111">CODE</text>
  </g>
  <line x1="435" y1="225.0" x2="487" y2="225.0" stroke="#111111" stroke-width="1" />
  <line x1="513" y1="225.0" x2="565" y2="225.0" stroke="#111111" stroke-width="1" />
  <circle cx="500" cy="225.0" r="13" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="230.0" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">4</text>
  <g>
    <rect x="10" y="204" width="425" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="24" y="222" font-size="15" font-weight="700" fill="#111111">Officer visits and judges the case</text>
    <text x="24" y="239" font-size="13.5" fill="#3a3a3a">Cash flow and character, from notes and memory</text>
  </g>
  <g>
    <rect x="565" y="204" width="388" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="579" y="222" font-size="15" font-weight="700" fill="#111111">Officer checks the flags and judges the case</text>
    <text x="579" y="239" font-size="13.5" fill="#3a3a3a">Source beside each value. Visits when flagged</text>
  </g>
  <line x1="435" y1="277.0" x2="487" y2="277.0" stroke="#111111" stroke-width="1" />
  <line x1="513" y1="277.0" x2="565" y2="277.0" stroke="#111111" stroke-width="1" />
  <circle cx="500" cy="277.0" r="13" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="282.0" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">5</text>
  <g>
    <rect x="10" y="256" width="425" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="24" y="274" font-size="15" font-weight="700" fill="#111111">Officer writes a recommendation</text>
    <text x="24" y="291" font-size="13.5" fill="#3a3a3a">From notes, in short free text</text>
  </g>
  <g>
    <rect x="565" y="256" width="388" height="42" rx="2" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="1.25"/>
    <text x="579" y="274" font-size="15" font-weight="700" fill="#111111">Scorecard recommends, with reasons</text>
    <text x="579" y="291" font-size="13.5" fill="#3a3a3a">A suggestion only. It never declines anyone</text>
    <text x="941" y="274" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="end" fill="#111111">CODE</text>
  </g>
  <line x1="435" y1="329.0" x2="487" y2="329.0" stroke="#1F3A5F" stroke-width="1" />
  <line x1="513" y1="329.0" x2="565" y2="329.0" stroke="#1F3A5F" stroke-width="1" />
  <circle cx="500" cy="329.0" r="13" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="500" y="334.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
  <g>
    <rect x="10" y="308" width="425" height="42" rx="2" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.25"/>
    <text x="24" y="326" font-size="15" font-weight="700" fill="#ffffff">Manager or committee decides</text>
    <text x="24" y="343" font-size="13.5" fill="#ffffff">Reasons are recorded in short notes</text>
  </g>
  <g>
    <rect x="565" y="308" width="388" height="42" rx="2" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.25"/>
    <text x="579" y="326" font-size="15" font-weight="700" fill="#ffffff">Loan officer decides</text>
    <text x="579" y="343" font-size="13.5" fill="#ffffff">Approve, change, decline or refer. Can override</text>
  </g>
  <line x1="435" y1="381.0" x2="487" y2="381.0" stroke="#111111" stroke-width="1" />
  <line x1="513" y1="381.0" x2="565" y2="381.0" stroke="#111111" stroke-width="1" />
  <circle cx="500" cy="381.0" r="13" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="386.0" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">7</text>
  <g>
    <rect x="10" y="360" width="425" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="24" y="378" font-size="15" font-weight="700" fill="#111111">File stored</text>
    <text x="24" y="395" font-size="13.5" fill="#3a3a3a">Little feedback on overrides or outcomes</text>
  </g>
  <g>
    <rect x="565" y="360" width="388" height="42" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
    <text x="579" y="378" font-size="15" font-weight="700" fill="#111111">Overrides and reasons are logged</text>
    <text x="579" y="395" font-size="13.5" fill="#3a3a3a">Team lead reviews patterns monthly, by group</text>
  </g>
  <path d="M953,381.0 H968 V173.0 H955" fill="none" stroke="#1F3A5F" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#back)"/>
  <text transform="translate(983,277.0) rotate(-90)" font-size="12" text-anchor="middle" fill="#111111">Overrides refine the checks</text>
  <line x1="10" y1="414" x2="953" y2="414" stroke="#111111" stroke-width="0.75"/>
  <rect x="10" y="426" width="28" height="14" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="50" y="438" font-size="13.5" fill="#111111">Person does it</text>
  <rect x="200" y="426" width="28" height="14" rx="2" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="1.25"/>
  <text x="240" y="438" font-size="13.5" fill="#111111">AI or code does it</text>
  <rect x="410" y="426" width="28" height="14" rx="2" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.25"/>
  <text x="450" y="438" font-size="13.5" fill="#111111">Person decides</text>
  <text x="953" y="438" font-size="13.5" font-weight="700" text-anchor="end" fill="#111111">The AI and the scorecard never decide</text>
</svg>
